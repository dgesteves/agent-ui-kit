name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library
        run: pnpm build:lib

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package exports (publint, attw)
        run: pnpm --filter @dgesteves/agent-ui-kit lint:package

      - name: shadcn registry
        run: pnpm registry:build

      - name: Build playground
        run: pnpm build:playground

  ai-sdk-6:
    name: AI SDK 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the oldest and the latest AI SDK 6 in turn, typecheck the library, run the tests
        working-directory: packages/agent-ui-kit
        run: |
          for version in 6.0.0 ^6; do
            pnpm add --save-dev "ai@$version"
            node -e "console.log('ai', require('ai/package.json').version)"
            pnpm exec tsc --noEmit -p tsconfig.src.json
            pnpm test
          done

  nextjs-quickstart:
    name: Next.js quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      # cacheComponents is on: next build fails if a component reads the clock or a random number
      # while prerendering (app/static/page.tsx renders every component from a Server Component).
      - name: Build examples/nextjs-minimal
        run: pnpm --filter nextjs-minimal build

      - name: Run the quickstart in Chrome, approve the command, wait for the final answer
        run: pnpm smoke:nextjs
