name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # the version commit, tags and GitHub releases
  pull-requests: write # the version pull request
  id-token: write # npm trusted publishing, with provenance
  actions: write # starting CI on the version pull request

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No registry-url and no token: npm trusted publishing authenticates this workflow with
      # OIDC, so there is no secret to leak or rotate.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Opens or updates a "Version packages" pull request from pending changesets; once that is
      # merged, publishes to npm and creates the GitHub release.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

      # The version pull request is pushed with this workflow's token, and pushes made with it
      # start no workflows, so start CI on it here: main only accepts pull requests that pass.
      - name: Run CI on the version pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
